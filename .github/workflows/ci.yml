name: Reprise checks

on:
  # Feature branches run through their PR; release tags reuse the tested commit.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes an older run on the same PR/branch.
concurrency:
  group: reprise-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
            browser: '0'
          - os: ubuntu-latest
            python: '3.13'
            browser: '1'
          - os: macos-latest
            python: '3.9'
            browser: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      REPRISE_BROWSER_TESTS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare check dependencies
        shell: bash
        run: |
          python -m pip install 'setuptools>=61' wheel
          mkdir -p work/test-artifacts/ci
          echo "REPRISE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Prepare optional browser
        if: matrix.browser == '1'
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          echo "REPRISE_PLAYWRIGHT=$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Git graph and workspace contracts
        shell: bash
        run: node --test tests/*.test.cjs | tee work/test-artifacts/ci/node.log
      - name: Full regression
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee work/test-artifacts/ci/python.log
      - name: Fresh installation checks
        shell: bash
        run: python scripts/check_distribution.py 2>&1 | tee work/test-artifacts/ci/distribution.log
      - name: Portable skill packages
        shell: bash
        run: |
          python scripts/build_skill.py --output work/test-artifacts/ci/reprise-skill.zip
          python scripts/build_skill.py --profile workbuddy --output work/test-artifacts/ci/reprise-workbuddy.zip
      - name: Package diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p work/test-artifacts/ci-upload
          tar --exclude=./ci-upload -czf work/test-artifacts/ci-upload/reprise-diagnostics.tar.gz -C work/test-artifacts .
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reprise-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: work/test-artifacts/ci-upload/reprise-diagnostics.tar.gz
          if-no-files-found: warn
          retention-days: 90
