/* RCA refinement: regular display type, continuous rules, shared text edges. */
:root{--gutter:32px;--aside-gutter:24px;--header-height:80px;--running-height:0px}
body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:400}
button,input,select{border-radius:0}
button,a,input,select,summary{touch-action:manipulation}
.app-shell:has(.running-bar:not([hidden])){--running-height:44px}
.app-header{height:var(--header-height)}
.brand{padding:0 var(--aside-gutter);gap:20px;font-size:24px;letter-spacing:-.4px}
.brand span{letter-spacing:0}
.nav-item{min-width:160px;font-size:14px}
.running-bar{min-height:44px;padding:5px var(--aside-gutter)}
.running-bar>div{gap:24px}
.running-bar button{min-height:32px;line-height:1.5}
.browser-layout{min-height:calc(100svh - var(--header-height) - var(--running-height))}
.current-git-choice,.version-card{padding:22px var(--aside-gutter)}
.search-box{padding:20px var(--aside-gutter);gap:12px}
.search-box input{appearance:none;min-height:24px}
.list-heading{padding:12px var(--aside-gutter);line-height:20px}
.version-list{max-height:calc(100svh - var(--header-height) - var(--running-height) - 112px);min-height:260px;scrollbar-gutter:stable}
.version-card time{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15px;margin-bottom:8px}
.version-card h3{font-size:15px;line-height:1.6;margin-bottom:0;overflow-wrap:anywhere}
.version-card p{margin-top:8px}
.version-card.selected,.current-git-choice.selected{background:var(--paper);box-shadow:inset 3px 0 var(--ink)}
.version-card.selected h3{font-weight:500}
.version-card:hover,.current-git-choice:hover{background:#f5f5f5}
.version-card:focus-visible,.current-git-choice:focus-visible,.nav-item:focus-visible,.close-modal:focus-visible{outline-offset:-5px}
.empty-list{padding:32px var(--aside-gutter);line-height:1.8}
.detail-header{padding:32px var(--gutter);gap:28px;align-items:flex-end}
.detail-header>div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;row-gap:14px;align-items:baseline;min-width:0;flex:1}
.detail-overline{grid-column:1;grid-row:1;margin:0;line-height:1.5}
.detail-header h2{grid-column:1/-1;grid-row:2;font-size:34px;line-height:1.3;letter-spacing:-.7px;overflow-wrap:anywhere}
.detail-header [data-rename]{grid-column:2;grid-row:1;min-height:20px;line-height:1.5;align-self:start}
.detail-header>.primary-button,.detail-header>.subtle-button{flex-shrink:0;margin-bottom:2px}
.primary-button,.subtle-button{min-height:44px;padding:10px 16px;line-height:1.5}
.text-button{min-height:32px;line-height:1.5;text-decoration-thickness:1px;text-underline-offset:4px}
.text-button:hover,.resource-actions button:hover,.running-bar button:hover{text-decoration-thickness:2px}
.change-content{padding:28px var(--gutter)}
.change-heading{gap:18px;margin-bottom:18px}
.change-heading h3{font-size:18px;line-height:1.4}
.detail-summary{font-size:16px;line-height:1.8;max-width:760px}
.change-list{gap:8px;line-height:1.8;margin-top:14px}
.change-list li{gap:12px;min-width:0}
.change-list li::before{flex:0 0 10px;color:var(--ink)}
.comparison-link{margin-top:24px;align-items:center}
.preview-toolbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;padding:16px var(--gutter);min-height:68px}

.preview-toolbar>button{grid-column:3;justify-self:end}
.screenshot-frame{padding:24px var(--gutter)}

.image-button:focus-visible{outline-offset:5px}

.preview-empty{padding:56px var(--gutter)}

.managed-section>h2,.section-heading{padding-bottom:18px}

.resource-status,.resource-size{font-size:12px;line-height:1.6}

.resource-actions{padding-right:0;gap:20px;justify-content:flex-end}
.resource-actions button{min-height:32px;line-height:1.5;white-space:nowrap;text-decoration-thickness:1px}

.inline-version-toggle[aria-expanded="false"]{color:#666}

.inline-version-content .detail-header h2{font-size:24px}
.inline-version-close{margin:12px 24px}
.detail-back{padding:18px var(--gutter)}
.evidence-tabs{flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:2}
.evidence-tabs button:hover{color:#111;background:transparent;text-decoration:none}
.evidence-tabs button:focus-visible,.inline-version-toggle:focus-visible,.inline-version-close:focus-visible,.detail-back:focus-visible{outline:2px solid #555;outline-offset:4px}

  if(node instanceof HTMLImageElement&&node.complete){mediaState(root,node.naturalWidth?'ready':'error',node.naturalWidth?'':'加载失败，请重试或打开原文件。');fitMedia(root);}
  if(node instanceof HTMLVideoElement&&node.readyState>=1){mediaState(root,'ready');fitMedia(root);}
}
function mediaRoots(node){return node instanceof Element?[...(node.matches('.media-viewer')?[node]:[]),...node.querySelectorAll('.media-viewer')]:[];}
new MutationObserver(records=>{
  for(const record of records){
    for(const node of record.addedNodes)mediaRoots(node).forEach(prepareMedia);
    for(const node of record.removedNodes)for(const root of mediaRoots(node)){mediaResize.unobserve(root.querySelector('.media-viewport'));const v=root.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load();}}
  }
}).observe(document.body,{childList:true,subtree:true});
for(const name of ['load','loadedmetadata','canplay','playing','seeked','waiting','error'])document.addEventListener(name,event=>{
  const node=event.target,root=node.closest?.('.media-viewer');if(!root||!node.matches('img,video'))return;
  if(name==='error'){mediaState(root,'error',node.error?.code===4?'视频格式无法播放，可打开原文件。':'加载失败，请重试或打开原文件。');return;}
  if(name==='waiting'){mediaState(root,'loading','正在缓冲…');return;}
  mediaState(root,'ready');fitMedia(root);
},true);
function openMedia(data){
  let dialog=document.querySelector('#media-zoom');
  if(!dialog){dialog=document.createElement('dialog');dialog.id='media-zoom';dialog.className='media-zoom-dialog';document.body.append(dialog);dialog.addEventListener('close',()=>{dialog.innerHTML='';});}
  dialog.innerHTML=`<div class="media-zoom-heading"><h2 data-user-content>${esc(data.label)}</h2><button data-media-close aria-label="关闭弹窗">×</button></div>${mediaMarkup(data,data.label,true)}`;
  dialog.showModal();
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  const root=button.closest('.media-viewer');
  if(button.hasAttribute('data-media-close'))button.closest('dialog').close();
  if(button.hasAttribute('data-media-open')&&root){root.querySelector('video')?.pause();openMedia(JSON.parse(root.dataset.mediaSource));}
  if(button.dataset.mediaZoom&&root){root.querySelector('.media-viewport').dataset.zoom=button.dataset.mediaZoom;root.querySelectorAll('[data-media-zoom]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fitMedia(root);}
  if(button.hasAttribute('data-media-retry')&&root){const node=root.querySelector('img,video');mediaState(root,'loading','正在加载…');const data=JSON.parse(root.dataset.mediaSource);node.src=data.url+(data.url.includes('?')?'&':'?')+'retry='+Date.now();if(node instanceof HTMLVideoElement)node.load();}
  if(button.hasAttribute('data-runtime-fullscreen')){const frame=button.closest('dialog').querySelector('.runtime-frame');frame.requestFullscreen().catch(()=>toast('请使用独立窗口查看。',true));}
});
document.addEventListener('close',event=>{if(event.target instanceof HTMLDialogElement)event.target.querySelectorAll('video').forEach(video=>video.pause());},true);
</script><script>'use strict';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let archiveMode='index',archiveLanguage='zh',previewAnimation=null,selectedDemo='sample-a';
const demoEntries={"sample-a": "01 · 项目概览", "sample-b": "02 · 设计资料", "sample-c": "03 · 内容档案", "sample-d": "04 · 工作记录", "sample-e": "05 · 交付说明", "sample-f": "06 · 参考素材"};
const templates=Object.fromEntries(Object.entries(archiveStates).map(([key,state])=>[key,new DOMParser().parseFromString(state.html,'text/html')]));
function archiveNotice(message) {
  const notice=document.querySelector('#archive-notice');notice.textContent=message;notice.hidden=false;
  clearTimeout(archiveNotice.timer);archiveNotice.timer=setTimeout(()=>notice.hidden=true,3600);
}
function fitVersionList() {
  const view=document.querySelector('#versions-view');if(!view||view.hidden)return;
  view.style.setProperty('--browse-header-height',document.querySelector('.app-header').offsetHeight+'px');
  const aside=view.querySelector('.version-browser'),box=aside.getBoundingClientRect(),top=Math.max(0,box.top);

function paintArchive(mode) {
  previewAnimation?.cancel();previewAnimation=null;
  const state=templates[mode+(archiveLanguage==='en'?'-en':'')]||templates[mode];
  document.querySelector('.app-shell').replaceWith(state.querySelector('.app-shell').cloneNode(true));
  document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===archiveLanguage)));
  document.documentElement.lang=archiveLanguage==='en'?'en':'zh-CN';
  document.querySelectorAll('[aria-busy]').forEach(e=>e.removeAttribute('aria-busy'));
  document.querySelectorAll('[inert]').forEach(e=>{if(!e.hidden)e.inert=false;});
  document.querySelectorAll('.media-viewer').forEach(root=>prepareMedia(root));
  archiveMode=mode;const currentChoice=document.querySelector('#current-git-choice');currentChoice.classList.toggle('selected',mode==='current');currentChoice.setAttribute('aria-pressed',String(mode==='current'));if(mode==='detail'){document.querySelector('#demo-title').textContent=demoEntries[selectedDemo];document.querySelectorAll('.version-card').forEach(row=>{const selected=row.dataset.select===selectedDemo;row.classList.toggle('selected',selected);row.setAttribute('aria-pressed',String(selected));});}fitVersionList();
}
function openArchive(mode,force=false) {
  const detail=['detail','current'].includes(mode),nextView=mode==='management'?'resources':'versions';
  const before=viewMotion.capture(nextView,force||(archiveMode!==mode&&archiveMode!=='index'));
  const directory=detail?browseMotion.capture():null;
  viewMotion.cancel();browseMotion.cancel();paintArchive(mode);window.scrollTo(0,0);
  if(before)viewMotion.open(before);else if(directory)browseMotion.open(directory);
}
function toggleArchivePreview(button) {
  const panel=document.getElementById(button.getAttribute('aria-controls'));if(!panel)return;
  const start=panel.hidden?0:panel.getBoundingClientRect().height;
  previewAnimation?.cancel();
  const open=button.getAttribute('aria-expanded')!=='true';
  button.setAttribute('aria-expanded',String(open));button.querySelector('.fold-icon')?.classList.toggle('is-open',open);
  panel.hidden=false;panel.inert=!open;
  const border=parseFloat(getComputedStyle(panel).borderTopWidth)+parseFloat(getComputedStyle(panel).borderBottomWidth);
  const end=open?Math.min(panel.firstElementChild.scrollHeight+border,innerHeight*.5,360):0;
  const finish=()=>{panel.hidden=!open;panel.style.overflow='';previewAnimation=null;};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return;}
  panel.style.overflow='hidden';
  const animation=panel.animate([{height:start+'px'},{height:end+'px'}],{duration:420,easing:gridMotion.easing,fill:'both'});
  previewAnimation=animation;
  animation.finished.then(()=>{if(previewAnimation===animation){finish();animation.cancel();}}).catch(()=>{});
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button,a');if(!button)return;
  if(button.closest('.media-viewer')||button.hasAttribute('data-media-close'))return;
  if(button.hasAttribute('data-index')){event.preventDefault();openArchive('index');return;}
  if(button.dataset.view){openArchive(button.dataset.view==='resources'?'management':'index');return;}
  if(button.hasAttribute('data-current-git')){openArchive('current');return;}
  if(button.dataset.select){
    if(selectedDemo===button.dataset.select&&archiveMode==='detail')return;selectedDemo=button.dataset.select;openArchive('detail',archiveMode==='detail');
    return;
  }
  if(button.dataset.language){archiveNotice('通用示例保留中文；将新项目的语言内容接入同一排版即可。');return;}
  if(button.hasAttribute('data-toggle-preview')){toggleArchivePreview(button);return;}
  if(button.dataset.previewChoice!==undefined){
    const p=archiveMedia[Number(button.dataset.previewChoice)],panel=button.closest('.preview-panel');if(!p||!panel)return;
    panel.querySelector('.screenshot-frame').innerHTML=mediaMarkup(p,p.caption);
    const choices=panel.querySelectorAll('[data-preview-choice]');for(const choice of choices){const selected=choice===button;choice.setAttribute('aria-pressed',String(selected));choice.querySelector('.preview-selected').textContent=selected?'✓':'';}
    const toggle=panel.querySelector('[data-toggle-preview]');
    if(toggle.getAttribute('aria-expanded')==='true')toggleArchivePreview(toggle);
    document.querySelector('#versions-caption').innerHTML='<p class="preview-note">'+esc(p.caption)+'</p>';
    return;
  }
  if(button.hasAttribute('data-compare-version')){
    const old=document.querySelector('#modal');if(old)old.remove();
    const modal=new DOMParser().parseFromString(archiveComparison,'text/html').querySelector('dialog');
    modal.removeAttribute('open');document.body.append(modal);modal.showModal();return;
  }
  if(button.closest('dialog')&&button.classList.contains('close-modal'))return;

});
document.addEventListener('input',event=>{
  if(event.target.id!=='search')return;
  const query=event.target.value.trim().toLowerCase(),list=document.querySelector('#version-list');
  list.querySelectorAll('.version-card').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query));

});

window.addEventListener('scroll',()=>requestAnimationFrame(fitVersionList),{passive:true});
