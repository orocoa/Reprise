<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reprise 静态站点示例</title><style>body{font:18px system-ui;background:#f5f2eb;color:#182c2a;margin:0;padding:10vw}h1{font-size:clamp(36px,7vw,88px);letter-spacing:-.05em;max-width:12ch;line-height:1.1}p{max-width:40em;line-height:1.8}button{font:inherit;border:0;background:#c84f2d;color:white;border-radius:12px;padding:16px 24px}small{color:#507871}</style><small>REPRISE / STATIC WEB</small><h1>每个版本，<br>都有来处。</h1><p>这是一个没有构建步骤、没有外部资源的普通 HTML 项目。Reprise 从 Git 提交生成独立副本，等待页面就绪，然后采集原始尺寸截图。</p><button id="toggle">查看状态</button><p id="state" aria-live="polite">等待操作</p><script>document.querySelector('#toggle').onclick=()=>document.querySelector('#state').textContent='交互正常 · 无需 AI';</script></html>
