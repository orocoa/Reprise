<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit / Web 游戏示例</title><style>*{box-sizing:border-box}body{margin:0;background:#142c32;color:#eef1df;font:18px system-ui;padding:5vw}main{max-width:950px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:60px;margin:20px 0}small{color:#a8c7bc;letter-spacing:.2em}canvas{display:block;width:100%;border:1px solid #527b7a;border-radius:18px;margin-top:32px;background:#17383b;outline-offset:6px}button{background:#e5a660;color:#142c32;border:0;border-radius:12px;padding:12px 22px;font:inherit}p{color:#b4d2c7;font-size:15px}</style><main><small>REPRISE / CANVAS GAME</small><header><h1>Orbit</h1><button id="start">开始游戏</button></header><p>点击开始，再使用方向键移动。版本变化可以通过固定操作的截图与录屏比较。</p><canvas id="game" width="900" height="420" tabindex="0" aria-label="用方向键控制小球"></canvas><p id="status">等待开始</p></main><script>const c=document.querySelector('#game'),ctx=c.getContext('2d');let x=140,y=210,running=false,moves=0;function draw(){ctx.clearRect(0,0,900,420);ctx.strokeStyle='#2f5656';for(let i=30;i<900;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,420);ctx.stroke()}for(let j=30;j<420;j+=60){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(900,j);ctx.stroke()}ctx.fillStyle='#e9ac61';ctx.beginPath();ctx.arc(x,y,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#badbc4';ctx.font='20px system-ui';ctx.fillText('MOVES  '+moves,35,45)}document.querySelector('#start').onclick=()=>{running=true;c.focus();document.querySelector('#status').textContent='游戏中 · 按方向键移动';draw()};c.onkeydown=e=>{if(!running)return;const d={ArrowRight:[35,0],ArrowLeft:[-35,0],ArrowUp:[0,-35],ArrowDown:[0,35]}[e.key];if(d){e.preventDefault();x=Math.max(25,Math.min(875,x+d[0]));y=Math.max(65,Math.min(395,y+d[1]));moves++;draw()}};draw();</script></html>
