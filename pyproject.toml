[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reprise-local"
version = "0.4.1"
description = "Local Git history, deterministic project detection and reproducible browser evidence"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
reprise = "reprise.cli:main"

[tool.setuptools]
packages = ["reprise", "reprise.web"]
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]

[tool.setuptools.package-dir]
"" = "src"
"reprise.web" = "web"

[tool.setuptools.package-data]
reprise = ["*.mjs"]
"reprise.web" = ["*.html", "*.js", "*.css", "*.svg", "*.ico", "fonts/*", "icons/*"]
